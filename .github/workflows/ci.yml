name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install GUI deps (winit/wgpu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libgl1-mesa-dev
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  # macOS is a first-class target (`cfg(target_os = "macos")` covers procinfo
  # unsafe blocks, the Dock icon, the fullscreen-stripe workaround, Cmd-key
  # branches): compile + test it so a macOS-only break never ships green.
  # No system-deps install needed (system frameworks ship with the runner).
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check
