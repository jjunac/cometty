name: Verify
description: Run locked tests, script tests, strict all-target Clippy, and rustfmt checks

runs:
  using: composite
  steps:
    - name: Test
      shell: bash
      run: cargo test --locked

    - name: Script tests
      shell: bash
      run: |
        sh -n install.sh
        python3 -B -m unittest discover -s scripts -p 'test_*.py'

    - name: Clippy
      shell: bash
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Format check
      shell: bash
      run: cargo fmt --check
