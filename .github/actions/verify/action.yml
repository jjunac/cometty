name: Verify
description: Run locked tests, strict all-target Clippy, and rustfmt checks

runs:
  using: composite
  steps:
    - name: Test
      shell: bash
      run: cargo test --locked

    - name: Clippy
      shell: bash
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Format check
      shell: bash
      run: cargo fmt --check
