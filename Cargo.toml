[package]
name = "cometty"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
arboard = "3"
winit = "0.30"
wgpu = "30"
egui = "0.36"
egui-winit = "0.36"
egui-wgpu = "0.36"
glyphon = "0.12"
cosmic-text = "0.19"
portable-pty = "0.9"
vte = "0.15"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
unicode-width = "0.2"
unicode-segmentation = "1"
bytemuck = { version = "1", features = ["derive"] }
# Native OS menu bar (app menu with Settings entry). Default features off:
# gtk/libxdo would need system libs on Linux, and we only attach the global
# menu on macOS — other platforms keep the Ctrl+, shortcut.
muda = { version = "0.19", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
