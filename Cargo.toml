[package]
name = "cometty"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1"
arboard = "3"
winit = "0.30"
wgpu = "30"
egui = "0.36"
egui-winit = "0.36"
egui-wgpu = "0.36"
glyphon = "0.12"
cosmic-text = { version = "0.19", features = ["shape-run-cache"] }
portable-pty = "0.9"
vte = "0.15"
# OSC guard keeps ordinary output on vte's bulk path (already a vte dependency).
memchr = "2"
pollster = "0.4"
# Window icon: decode embedded PNG rasterized from logo.svg (PNG only).
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
# Directive filters for the in-app log panel (the crate env_logger uses
# internally): the ring records by target (`cometty=debug,warn`) instead of
# recording every dependency's debug/trace spam.
env_filter = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
bytemuck = { version = "1", features = ["derive"] }
# Config file (TOML) + serde derives; used on every platform (these were
# nested under the macOS-only section, which broke non-macOS builds).
serde = { version = "1", features = ["derive"] }
# OSC 52 clipboard payloads (base64 encode/decode); tiny, no transitive deps.
base64 = "0.22"
# Word selection pattern (`[selection] word_regex`, match-words semantics).
regex = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# Auto-update (docs/update.md): blocking HTTPS client with rustls + ring +
# webpki-roots; no gzip/brotli/cookies. Exact pins, recorded in Cargo.lock.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
# Auto-update GitHub release metadata (unknown fields ignored). Exact pin.
serde_json = "=1.0.154"
# Auto-update SHA-256 of the release archive. Exact pin.
sha2 = "=0.11.1"
[dev-dependencies]
# Native allocation counters for the opt-in offscreen staging regression only.
# Normal builds keep wgpu's counter instrumentation disabled.
wgpu = { version = "30", features = ["counters"] }

[target.'cfg(unix)'.dependencies]
# Foreground-process `$command`/`$cwd` tab-label sources (`tcgetpgrp` +
# `proc_pidpath`/`proc_pidinfo` on macOS; `/proc` on Linux).
libc = "0.2"
[target.'cfg(target_os = "macos")'.dependencies]
# Native OS menu bar (app menu with Settings + Logs entries). Default features
# off: only macOS attaches the global menu (`init_for_nsapp`); other platforms
# keep the Ctrl+, / Ctrl+Shift+L shortcuts, and muda without its gtk feature
# does not compile on Linux.
muda = { version = "0.19", default-features = false }
# Runtime Dock icon (`NSApplication::setApplicationIconImage`): winit's
# `with_window_icon` is ignored on macOS, where icons come from the app
# bundle. This sets the Dock tile for unbundled runs (`cargo run`).
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# 0.19's final-shaping cache needs capacity admission and a direction-aware key.
# Shared with glyphon; see vendor/cosmic-text/PATCHES.md for removal/update steps.
[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }
